<div class="min-h-screen bg-system-background text-on-surface font-body-md">
  <header class="glass-topbar sticky top-0 z-50 h-14">
    <div class="page-shell flex h-14 items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <a routerLink="/" class="flex items-center gap-2 shrink-0">
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-on-primary"><span class="material-symbols-outlined text-[18px]">storefront</span></span>
          <span class="font-title-md tracking-tight hidden sm:block">Tienda</span>
        </a>
        <button class="btn-ghost !py-1.5 !px-3 !rounded-lg !font-medium" (click)="toggleMenu()">
          <span class="material-symbols-outlined text-[18px]">menu</span>
          <span class="hidden md:inline">Categorías</span>
        </button>
      </div>

      <form class="hidden md:flex flex-1 max-w-2xl" (ngSubmit)="onSearch()">
        <div class="relative w-full">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant">search</span>
          <input class="input-field !pl-10 !py-2 !rounded-lg !bg-surface-container-low !border-transparent focus:!bg-white" [(ngModel)]="searchText" name="searchText" placeholder="Buscar productos, marcas y categorías" />
        </div>
      </form>

      <div class="flex items-center gap-1 sm:gap-2 shrink-0">
        <a routerLink="/mis-pedidos" class="hidden sm:inline-flex btn-ghost !border-transparent !bg-transparent hover:!bg-black/5 !px-2.5 !py-1.5">
          <span class="material-symbols-outlined text-[18px]">receipt_long</span><span class="font-label-md">Mis pedidos</span>
        </a>
        <a *ngIf="!auth.isAuthenticated(); else acc" [routerLink]="['/login']" [queryParams]="{returnUrl: currentUrl()}" class="btn-ghost !border-transparent !bg-transparent hover:!bg-black/5 !px-2.5 !py-1.5">
          <span class="material-symbols-outlined text-[18px]">person</span><span class="hidden sm:inline font-label-md">Ingresar</span>
        </a>
        <ng-template #acc>
          <div class="hidden sm:flex items-center gap-2">
            <span class="font-label-md text-on-surface-variant">Hola, {{ auth.user()?.nombreCompleto?.split(' ')?.[0] || 'Cliente' }}</span>
            <button class="text-primary font-label-md" (click)="logout()">Salir</button>
          </div>
        </ng-template>
        <a routerLink="/carrito" class="relative btn-primary !py-1.5 !px-3 !rounded-lg">
          <span class="material-symbols-outlined text-[18px]">shopping_bag</span>
          <span class="hidden sm:inline">Carrito</span>
          <span *ngIf="cart.count()>0" class="tabular-nums inline-flex min-w-5 h-5 items-center justify-center rounded-full bg-white text-primary text-[11px] font-semibold px-1">{{ cart.count() }}</span>
        </a>
      </div>
    </div>

    <div *ngIf="showMenu" class="border-t border-separator-hairline-light bg-white/95 backdrop-blur-xl">
      <div class="page-shell py-6">
        <div class="font-caption text-on-surface-variant mb-3">Departamentos</div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-2 max-h-[60vh] overflow-auto pr-2">
          <a class="font-body-sm py-1.5 hover:text-primary" routerLink="/productos" (click)="showMenu=false">Todos los departamentos</a>
          <a class="font-body-sm py-1.5 text-primary" routerLink="/productos" [queryParams]="{soloOfertas: true}" (click)="showMenu=false">Ofertas</a>
          @for (d of departments(); track d.id) {
            <a class="font-body-sm py-1.5 hover:text-primary transition-colors" [routerLink]="['/productos']" [queryParams]="{categoriaId: d.id}" (click)="showMenu=false">{{d.nombre}}</a>
          }
        </div>
      </div>
    </div>

    <div class="md:hidden border-t border-separator-hairline-light bg-surface-glass-light">
      <form class="page-shell py-2" (ngSubmit)="onSearch()">
        <input class="input-field !py-2 !bg-surface-container-low" [(ngModel)]="searchText" name="searchTextMobile" placeholder="Buscar en la tienda" />
      </form>
    </div>
  </header>

  <main class="page-shell py-6 sm:py-8">
    <router-outlet />
  </main>
</div>
